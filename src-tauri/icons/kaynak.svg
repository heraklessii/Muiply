<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Muiply uygulama ikonunun KAYNAĞI.

    Buradaki her PNG (icon.png, icon.ico, Square*Logo.png ...) bu dosyadan
    üretiliyor. İkonu değiştirmek isteyen önce burayı düzenler, sonra:

        npx tauri icon src-tauri/icons/kaynak.svg

    Komut Windows dışı hedefler de üretir (android/, ios/, icon.icns);
    Muiply şimdilik yalnız nsis+msi paketlediği için onlar silinir.

    Glyph, `public/icons/muiply.svg` ve `index.html` favicon'uyla AYNI yol;
    sadece 32'lik ızgaradan 1024'e ölçeklenmiş hâli (çarpan 32). Üçünden biri
    değişirse diğer ikisi de değişmeli.

    Kare/gradyan iskeleti Mui ailesinden (Muiget, Muivly, Muifly, MuiLabs,
    Muiwatch) geliyor: aynı köşe yarıçapı, aynı koyu zemin, aynı teal vurgu.

    Glyph neden çember + üçgen: Muiwatch'ın ikonu bir EKRAN, çünkü işi iki
    kişiye aynı kareyi izletmek. Muiply'in işi tek şey — dosyayı açıp çalmak.
    O yüzden ekran yok, yalnız oynat işareti. Dolu olan tek öğe üçgen;
    ailenin "tek dolu vurgu" kuralı.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b232c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="cizgi" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#zemin)"/>

  <!-- 32'lik ızgaradaki değerlerin 32 katı -->
  <circle cx="512" cy="512" r="339.2" fill="none" stroke="url(#cizgi)" stroke-width="76.8"/>
  <path d="M396.8 313.6 716.8 512 396.8 710.4z" fill="url(#cizgi)"/>
</svg>
