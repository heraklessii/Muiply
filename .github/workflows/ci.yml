name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Art arda atılan iki commit'te ilkini sonuna kadar beklemenin faydası yok.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  arayuz:
    name: Arayüz (tsc + vite + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  motor:
    name: Motor (test + clippy + fmt)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Rust derlemesi `dist/` olmadan başarısız olur: `tauri.conf.json`
      # içindeki `frontendDist` yolunu `generate_context!` derleme anında
      # arıyor. Bu yüzden testten önce arayüz derleniyor.
      - run: npm ci
      - run: npm run build

      # ---------------------------------------------------------------
      # Buradan aşağısı MOTORSUZ (`--no-default-features`) ve bu bir
      # eksiklik değil, deponun bir sonucu:
      #
      # libmpv BAĞLAMA zamanında bağlanıyor ve ikilileri depoda yok
      # (`.gitignore` — lisansı LGPL, DLL 120 MB). Motorlu bir derleme
      # CI'da `mpv.lib` üretmeyi, o da arşivi indirip `dumpbin`/`lib` ile
      # içe aktarma kitaplığı kurmayı gerektirirdi (docs/Setup.md).
      #
      # Kaybedilen şey sanıldığı kadar büyük değil: testlerin TAMAMI
      # (70'i) motorsuz da çalışıyor, çünkü hiçbiri mpv'ye dokunmuyor —
      # kuyruk gezinme, altyazı eşleştirme, ayar düzeltme, SQLite şeması
      # ve uzantı listelerinin tutarlılığı saf kod. CI'nin kapsamadığı
      # tek şey libmpv'ye BAĞLANMANIN kendisi ve onu yerel paketleme
      # (`npm run tauri:paket`) her sürümde zaten yapıyor.
      # ---------------------------------------------------------------
      - name: cargo test --no-default-features
        working-directory: src-tauri
        run: cargo test --no-default-features

      # `mpv/yok.rs`in yüzeyi `gercek.rs` ile ayrıştığı anda burası düşüyor.
      # O ayrışma normalde en kötü anda fark ediliyor (CLAUDE.md #4).
      - name: cargo clippy --no-default-features
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
